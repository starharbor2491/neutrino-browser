[package]
name = "neutrino-shell"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
maud = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = {version = "1", features = ["float_roundtrip"]}
url = "2"

roxmltree = "0.20"
rusqlite = "0.32"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
