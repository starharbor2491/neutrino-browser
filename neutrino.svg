      <stop offset=".72" stop-color="#AE6ACF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8046B5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".72">
      <stop offset=".45" stop-color="#020611" stop-opacity="0"/>
      <stop offset="1" stop-color="#020611" stop-opacity=".55"/>
    </radialGradient>
    <filter id="softDust" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02030B" flood-opacity=".55"/>
    </filter>
    <clipPath id="tile">
      <rect width="1130" height="1130" rx="244"/>
    </clipPath>
  </defs>
