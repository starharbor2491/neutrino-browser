<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1130 1130" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Neutrino browser icon</title>
  <desc id="desc">A purple isometric cube with three trails sweeping from the upper left, against a midnight galaxy with violet nebulae and distant stars.</desc>
  <defs>
    <linearGradient id="space" x1="100" y1="0" x2="1030" y2="1130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D22"/>
      <stop offset=".5" stop-color="#110C25"/>
      <stop offset="1" stop-color="#050A17"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop stop-color="#7335AD" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#48217B" stop-opacity=".32"/>
      <stop offset="1" stop-color="#30134F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue">
      <stop stop-color="#277C9D" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#244C82" stop-opacity=".22"/>
      <stop offset="1" stop-color="#17304D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dust" x1="110" y1="970" x2="1000" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B99C9" stop-opacity="0"/>
