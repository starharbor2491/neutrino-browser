name: Build Neutrino development installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build complete Apple Silicon application
        run: ./scripts/build-app.sh
      - name: Test native application and portable core
        run: ./scripts/test.sh
      - name: Package complete offline development installer
        run: python3 scripts/package-release.py --development
      - name: Verify the installed application and Blink integration
        env:
          NEUTRINO_CHROMIUM_WEBSTORE_TEST: "1"
        run: python3 scripts/installed-smoke.py --chromium-restart
      - uses: actions/upload-artifact@v4
        with:
          name: Neutrino-AppleSilicon-development
          path: |
            dist/*.dmg
            dist/*-package.json
            dist/installed-smoke.json
            dist/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Neutrino-development-diagnostics
          path: dist/*.log
          if-no-files-found: warn
