name: Build and test Neutrino
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neutrino-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core and validate packages
        run: ./scripts/test.sh
      - name: Build WebKit shell development app
        env:
          NEUTRINO_WEBKIT_DEVELOPMENT_ONLY: "1"
        run: ./scripts/build-app.sh
      - name: Verify native integration in release configuration
        env:
          NEUTRINO_DISTRIBUTION_TEST_APP: ${{ github.workspace }}/dist/Neutrino.app
        run: python3 scripts/native-tests.py -c release --filter 'BrowserIntegrationTests|WorkspaceIntegrationTests|ResourceModuleTests|ReaderModuleTests|BehaviorModuleTests|DistributionNativeTests|DownloadsTests|ProfilesIntegrationTests|ChromiumProfileDataTests'
      - name: Package graphical development installer
        run: python3 scripts/package-release.py --development --allow-webkit-development
      - name: Launch packaged app and capture native screens
        timeout-minutes: 3
        run: python3 scripts/installed-smoke.py
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent dist/Neutrino.app dist/Neutrino-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Neutrino-macOS-local-build
          path: |
            dist/Neutrino-macOS.zip
            dist/*.dmg
            dist/*-package.json
            dist/installed-smoke.json
            dist/smoke-performance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Neutrino-native-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Neutrino-launch-diagnostics
          path: |
            dist/smoke-*.log
            dist/smoke-sample.txt
            dist/native-tests*.log
            dist/native-tests*.txt
            dist/*-package.json
            dist/installed-smoke.json
            dist/smoke-performance.json
          if-no-files-found: warn
  portable-core:
    runs-on: ubuntu-24.04
    container: swift:6.2.1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev python3
      - run: ./scripts/test.sh
