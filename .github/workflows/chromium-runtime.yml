name: Verify embedded Chromium runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ChromiumRuntime/**'
      - 'Package.swift'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'neutrino.svg'
      - 'Sources/NeutrinoRust/**'
      - 'Sources/CSQLite/**'
      - 'Sources/NeutrinoCore/**'
      - 'Sources/NeutrinoEngineABI/**'
      - 'Sources/NeutrinoApp/**'
      - 'Sources/NeutrinoDistribution/**'
      - 'Sources/NeutrinoUpdater/**'
      - 'Sources/NeutrinoReaderLogic/**'
      - 'Tests/NeutrinoAppTests/**'
      - 'Tests/NeutrinoCoreTests/**'
      - 'Tests/NeutrinoReaderTests/**'
      - 'Resources/Info.plist'
      - 'Resources/Entitlements/**'
      - 'scripts/chromium-runtime.py'
      - 'scripts/build-app.sh'
      - 'scripts/build-rust.sh'
      - 'scripts/build-workers.sh'
      - 'scripts/distribution-metadata.py'
      - 'scripts/sign-release.py'
      - 'scripts/package-release.py'
      - 'scripts/test.sh'
      - 'scripts/native-tests.py'
      - 'scripts/validate-packages.py'
      - 'scripts/smoke-app.sh'
      - 'scripts/smoke-server.py'
      - 'scripts/smoke-chromium-restart.py'
      - 'scripts/installed-smoke.py'
      - '.github/workflows/chromium-runtime.yml'
permissions:
  contents: read
concurrency:
  group: neutrino-chromium-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  embedded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned Chromium SDK
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/neutrino-cef-runtime
          key: neutrino-cef-views-7-${{ matrix.arch }}-${{ hashFiles('ChromiumRuntime/cef-version.json') }}
          restore-keys: neutrino-cef154-views-7-${{ matrix.arch }}
      - name: Build pinned Blink package
        id: chromium-build
        run: python3 scripts/chromium-runtime.py --arch "${{ matrix.arch }}" --work-dir "$RUNNER_TEMP/neutrino-cef-runtime"
      - name: Cache verified Chromium SDK
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/neutrino-cef-runtime
          key: neutrino-cef-views-7-${{ matrix.arch }}-${{ hashFiles('ChromiumRuntime/cef-version.json') }}
      - name: Test native shell
        id: native-tests
        run: ./scripts/test.sh
      - name: Build complete Apple Silicon Neutrino application
        id: app-build
        # Build, package and smoke provide diagnostics when an independent
        # native test fails. That failure still gates validated app artifacts.
        if: ${{ !cancelled() && steps.chromium-build.outcome == 'success' }}
        env:
          NEUTRINO_CHROMIUM_PACKAGE: ${{ runner.temp }}/neutrino-cef-runtime/Chromium-${{ matrix.arch }}.neutrinoengine
        run: ./scripts/build-app.sh
      - name: Package graphical development installer
        id: installer-package
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        run: python3 scripts/package-release.py --development
      - name: Verify installed Chromium renders inside Neutrino and quits normally
        if: ${{ !cancelled() && steps.chromium-build.outcome == 'success' && steps.app-build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          NEUTRINO_CHROMIUM_WEBSTORE_TEST: "1"
          NEUTRINO_SMOKE_DEBUGGER: "attach"
          NEUTRINO_CHROMIUM_PACKAGE: ${{ runner.temp }}/neutrino-cef-runtime/Chromium-${{ matrix.arch }}.neutrinoengine
          NATIVE_TESTS_PASSED: ${{ steps.native-tests.outcome == 'success' }}
          INSTALLER_PACKAGE_PASSED: ${{ steps.installer-package.outcome == 'success' }}
        run: |
          if [[ "$NATIVE_TESTS_PASSED" == "true" && "$INSTALLER_PACKAGE_PASSED" == "true" ]]; then
            python3 scripts/installed-smoke.py --chromium-restart
          else
            ./scripts/smoke-app.sh
          fi
      - name: Archive development runtime
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/neutrino-cef-runtime/Chromium-${{ matrix.arch }}.neutrinoengine" "dist/Chromium-${{ matrix.arch }}.neutrinoengine.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Neutrino.app "dist/Neutrino-Chromium-${{ matrix.arch }}.zip"
      - name: Record native runtime validation
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'neutrino-cef-runtime' / 'neutrino-adapter-${{ matrix.arch }}.json'
          evidence = json.loads(path.read_text())
          evidence['neutrinoEmbeddedRuntimeValidated'] = True
          evidence['chromeExtensions'] = True
          evidence['runtimeStyle'] = 'chromeViews'
          evidence['hostPresentation'] = 'clippedNative'
          evidence['testedSource'] = os.environ['GITHUB_SHA']
          evidence['nativeChecks'] = ['HTTP', 'HTTPS', 'reader', 'PNG capture', 'profiles', 'private windows', 'normal/private popup policy and opener', 'Neutrino page geometry and focus', 'MV3 lifecycle and APIs', 'extension auxiliary window identity and lifetime', 'Chrome Web Store installation', 'extension persistence after process restart', 'extension removal', 'tab close', 'extension manager open during normal quit']
          path.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Neutrino-Chromium-${{ matrix.arch }}-development-runtime
          path: |
            dist/*.dmg
            dist/*-package.json
            dist/installed-smoke.json
            dist/smoke-performance.json
            dist/research-acceptance.json
            dist/Chromium-*.neutrinoengine.zip
            dist/Neutrino-Chromium-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Neutrino-Chromium-${{ matrix.arch }}-diagnostics
          path: |
            dist/screenshots/*.png
            dist/smoke-*.log
            dist/smoke-sample.txt
            dist/smoke-crashes/*
            dist/native-tests*.log
            dist/native-tests*.txt
            dist/smoke-data/Chromium/engine.log
            dist/*-package.json
            dist/installed-smoke.json
            dist/smoke-performance.json
            dist/research-acceptance.json
            ${{ runner.temp }}/neutrino-cef-runtime/neutrino-adapter-*.json
          if-no-files-found: warn
