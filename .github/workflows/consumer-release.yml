name: Build signed consumer installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0)'
        required: true
        default: '1.0.0'
      security_epoch:
        description: 'Monotonic engine security epoch (at least the pinned Chromium major)'
        required: true
        default: '154'
      publish:
        description: 'Publish the complete notarized Apple Silicon installer and catalog as a GitHub release'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            variant: AppleSilicon
            chromium: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NEUTRINO_SIGNING_IDENTITY: ${{ secrets.NEUTRINO_SIGNING_IDENTITY }}
      NEUTRINO_VERSION: ${{ inputs.version }}
      NEUTRINO_BUILD_NUMBER: ${{ github.run_id }}
      NEUTRINO_SECURITY_EPOCH: ${{ inputs.security_epoch }}
      NEUTRINO_RELEASE_TAG: v${{ inputs.version }}
      NEUTRINO_UPDATE_CHANNEL: stable
      NEUTRINO_SPARKLE_PUBLIC_KEY: ${{ vars.NEUTRINO_SPARKLE_PUBLIC_KEY }}
      NEUTRINO_SPARKLE_PRIVATE_KEY: ${{ secrets.NEUTRINO_SPARKLE_PRIVATE_KEY }}
      NEUTRINO_NOTARY_KEY_ID: ${{ secrets.NEUTRINO_NOTARY_KEY_ID }}
      NEUTRINO_NOTARY_ISSUER: ${{ secrets.NEUTRINO_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure ephemeral signing keychain and notary key
        env:
          CERTIFICATE: ${{ secrets.NEUTRINO_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.NEUTRINO_SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NEUTRINO_NOTARY_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['CERTIFICATE', 'CERTIFICATE_PASSWORD', 'NOTARY_KEY', 'NEUTRINO_SIGNING_IDENTITY', 'NEUTRINO_NOTARY_KEY_ID', 'NEUTRINO_NOTARY_ISSUER', 'NEUTRINO_SPARKLE_PUBLIC_KEY', 'NEUTRINO_SPARKLE_PRIVATE_KEY']
          if not all(os.environ.get(key) for key in required):
              raise SystemExit('Developer ID and App Store Connect notarization secrets are required; unsigned consumer packaging is not supported.')
          directory = Path(os.environ['RUNNER_TEMP'])
          (directory / 'neutrino-signing.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE'], validate=True))
          key = directory / 'neutrino-notary.p8'
          key.write_bytes(base64.b64decode(os.environ['NOTARY_KEY'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('NEUTRINO_NOTARY_KEY=' + str(key) + '\n')
          PY
          signing_keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$signing_keychain_password" "$RUNNER_TEMP/neutrino-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/neutrino-signing.keychain-db"
          security unlock-keychain -p "$signing_keychain_password" "$RUNNER_TEMP/neutrino-signing.keychain-db"
          security import "$RUNNER_TEMP/neutrino-signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/neutrino-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_keychain_password" "$RUNNER_TEMP/neutrino-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/neutrino-signing.keychain-db" /Library/Keychains/System.keychain
      - name: Test native application
        run: ./scripts/test.sh
      - name: Build Chromium engine
        if: matrix.chromium != ''
        run: python3 scripts/chromium-runtime.py --arch '${{ matrix.chromium }}' --work-dir "$RUNNER_TEMP/neutrino-runtime"
      - name: Sign complete Neutrino application
        env:
          CHROMIUM_ARCH: ${{ matrix.chromium }}
        run: |
          if [[ -n "$CHROMIUM_ARCH" ]]; then
            export NEUTRINO_CHROMIUM_PACKAGE="$RUNNER_TEMP/neutrino-runtime/Chromium-$CHROMIUM_ARCH.neutrinoengine"
          fi
          ./scripts/build-app.sh
      - name: Native packaged application acceptance
        env:
          CHROMIUM_ARCH: ${{ matrix.chromium }}
          NEUTRINO_CHROMIUM_WEBSTORE_TEST: "1"
        run: |
          if [[ -n "$CHROMIUM_ARCH" ]]; then
            export NEUTRINO_CHROMIUM_PACKAGE="$RUNNER_TEMP/neutrino-runtime/Chromium-$CHROMIUM_ARCH.neutrinoengine"
          fi
          ./scripts/smoke-app.sh
      - name: Verify installed Chrome Web Store extension after process restart
        if: matrix.chromium != ''
        run: python3 scripts/smoke-chromium-restart.py
      - name: Notarize application and graphical offline installer
        run: python3 scripts/package-release.py
      - name: Verify the exact notarized installer after installation
        env:
          NEUTRINO_CHROMIUM_WEBSTORE_TEST: "1"
        run: python3 scripts/installed-smoke.py --chromium-restart
      - uses: actions/upload-artifact@v4
        with:
          name: Neutrino-consumer-${{ matrix.variant }}
          path: |
            dist/*.dmg
            dist/*.app.zip
            dist/SHA256SUMS
            dist/sparkle-status.json
            dist/stable.xml
            dist/*-package.json
            dist/*-catalog-entry.json
            dist/installed-smoke.json
          if-no-files-found: error
      - name: Remove ephemeral credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/neutrino-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/neutrino-signing.p12" "$RUNNER_TEMP/neutrino-notary.p8"
  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: Neutrino-consumer-*
          path: release
          merge-multiple: true
      - name: Require recorded core acceptance for this exact installer
        env:
          CORE_ACCEPTANCE_JSON: ${{ vars.NEUTRINO_CORE_ACCEPTANCE_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('CORE_ACCEPTANCE_JSON', '')
          if not value or len(value.encode()) > 256 * 1024:
              raise SystemExit('Configure NEUTRINO_CORE_ACCEPTANCE_JSON after testing this candidate, including protected streaming. No unverified core release will be published.')
          Path('release/core-acceptance.json').write_text(value)
          PY
          python3 scripts/core-acceptance.py --directory release --receipt release/core-acceptance.json --checkout "$GITHUB_SHA"
      - name: Assemble compatible release catalog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?', os.environ['RELEASE_VERSION']):
              raise SystemExit('Invalid version')
          root = Path('release')
          entries = [json.loads(path.read_text()) for path in root.glob('*-catalog-entry.json')]
          if len(entries) != 1:
              raise SystemExit('One complete notarized Apple Silicon installer is required')
          (root / 'catalog.json').write_text(json.dumps({'format': 1, 'releases': entries}, indent=2) + '\n')
          PY
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$RELEASE_VERSION" release/*.dmg release/*.app.zip release/SHA256SUMS release/*-package.json release/catalog.json release/installed-smoke.json release/core-acceptance.json --target "$GITHUB_SHA" --title "Neutrino $RELEASE_VERSION" --notes 'Neutrino for Apple Silicon. Download the app ZIP or drag Neutrino.app from the offline DMG to Applications. Both include Blink, WebKit support, helpers, and built-in modules. Updates download from GitHub and install after quitting while preserving browser data. Native, installed, and publisher-recorded core acceptance are attached.'
